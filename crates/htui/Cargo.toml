[package]
name = "htui"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
crossterm = "0.29.0"
env_logger = "0.11.9"
cssparser = "0.31.2"
html5ever = "0.27"
image = "0.25.9"
indexmap = "2.14"
log = { version = "0.4.29", features = ["release_max_level_warn"] }
markup5ever_rcdom = "0.3"
slotmap = "1.1.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
boa_engine = { version = "0.21.1", default-features = false }
htui_macros = { path = "../htui-macros", package = "htui-macros" }
thiserror = "2.0.19"

[dev-dependencies]
criterion = "0.8"
[[bench]]
name = "parse"
harness = false

[[bench]]
name = "cascade"
harness = false

[[bench]]
name = "paint"
harness = false

[[bench]]
name = "render_to_bytes"
harness = false

[[bench]]
name = "full_redraw"
harness = false
