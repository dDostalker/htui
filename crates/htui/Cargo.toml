[package]
name = "htui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal HTML/CSS renderer with an embedded JavaScript engine — build interactive TUIs from HTML, CSS and JS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dDostalker/htui"
homepage = "https://github.com/dDostalker/htui"
documentation = "https://docs.rs/htui"
readme = "README.md"
keywords = ["tui", "terminal", "html", "css", "javascript"]
categories = ["command-line-interface", "gui", "rendering"]

[dependencies]
bitflags = "2"
crossterm = "0.29.0"
cssparser = "0.31.2"
html5ever = "0.27"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
indexmap = "2.14"
log = { version = "0.4.29", features = ["release_max_level_warn"] }
markup5ever_rcdom = "0.3"
slotmap = "1.1.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
boa_engine = { version = "0.21.1", default-features = false }
htui_macros = { path = "../htui-macros", version = "0.1.0", package = "htui-macros" }
thiserror = "2.0.19"
compact_str = "0.10.0"

[dev-dependencies]
env_logger = "0.11.9"

[lints]
workspace = true