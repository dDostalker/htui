[package]
name = "htui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal HTML/CSS renderer with an embedded JavaScript engine — build interactive TUIs from HTML, CSS and JS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dDostalker/htui"
homepage = "https://github.com/dDostalker/htui"
documentation = "https://docs.rs/htui"
readme = "README.md"
keywords = ["tui", "terminal", "html", "css", "javascript"]
categories = ["command-line-interface", "gui", "rendering"]

[dependencies]
bitflags = { workspace = true }
crossterm = { workspace = true }
cssparser = { workspace = true }
html5ever = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
markup5ever_rcdom = { workspace = true }
slotmap = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
boa_engine = { workspace = true }
htui-macros = { workspace = true }
thiserror = { workspace = true }
compact_str = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }

[lints]
workspace = true