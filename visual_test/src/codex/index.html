<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Codex (demo)</title>
<style>
  body { font-family: monospace; margin: 0; padding: 0 1; }
  #header {
    color: #7ee787;
    padding: 0 0 1 0;
    border-bottom: 1 solid #30363d;
    margin-bottom: 1;
  }
  #header .model { color: #8b949e; }
  #thread { width: 100%; }
  .msg { padding: 0 1; margin-bottom: 1; }
  .user { color: #7ee787; }
  .assistant { color: #79c0ff; }
  .dim { color: #8b949e; }
  #composer { color: #e6edf3; }
  #hint { color: #8b949e; margin-top: 1; }
</style>
</head>
<body>
  <div id="header">
    <span class="model">code </span>
    <span class="dim">cryptic-coder · coding agent demo (no execution)</span>
  </div>
  <div id="thread">
    <div class="msg assistant">Ask me something below. Type a message and press <b>Enter</b> to send.</div>
  </div>
  <input id="composer" value="" width="72">
  <div id="hint">click the input to focus · type · Enter sends (focus is released after send — click again)</div>

  <script>
    var thread = document.getElementById('thread');
    var composer = document.getElementById('composer');

    // `change` fires when the field commits (Enter / blur), so `composer.value`
    // holds the just-sent text (during typing the DOM value lags the buffer —
    // see docs/examples-notes.md).
    composer.addEventListener('change', function () {
      var text = composer.value.trim();
      if (text === '') return;

      var user = document.createElement('div');
      user.className = 'msg user';
      user.textContent = '> ' + text;
      thread.appendChild(user);

      var reply = document.createElement('div');
      reply.className = 'msg assistant';
      reply.textContent = '· · · (execution disabled in this demo)';
      thread.appendChild(reply);

      composer.value = '';
    });
  </script>
</body>
</html>
