<!doctype html>
<html>
<head><title>htui fetch demo</title></head>
<body>
  <h1>fetch / event loop demo</h1>
  <p>This page loads its JS from a <code>mem://</code> resource
  (<code>&lt;script src="mem://demo/app.js"&gt;</code>) and reads a text
  file with <code>fetch('mem://demo/hello.txt')</code> — resolved through
  the Promise microtask event loop.</p>
  <p id="status">loading…</p>
  <p id="output"></p>
  <script src="mem://demo/app.js"></script>
</body>
</html>
