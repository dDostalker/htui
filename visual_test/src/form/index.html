<!doctype html>
<html>
<head>
  <style>
    /* Functional styles only: checkbox/radio/password/hidden + change events.
       Flex rows place the toggle control next to its label (replaced inline
       elements sit below text in the engine's flow layout). */
    .row { display: flex; }
  </style>
</head>
<body>
  <h2>checkbox (click to toggle)</h2>
  <div class="row"><input type="checkbox" id="remember"><div>Remember me</div></div>
  <div class="row"><input type="checkbox" checked><div>Pre-checked</div></div>

  <h2>radio (same name = exclusive group)</h2>
  <div class="row"><input type="radio" name="size" checked><div>Small</div></div>
  <div class="row"><input type="radio" name="size"><div>Medium</div></div>
  <div class="row"><input type="radio" name="size"><div>Large</div></div>

  <h2>password (masked input)</h2>
  <p><input type="password" id="pw" value="hunter2"></p>

  <h2>textarea (multi-line editing)</h2>
  <textarea id="note" cols="30" rows="4">First line
Second line
</textarea>

  <h2>hidden (renders nothing)</h2>
  <p>Before <input type="hidden" id="hid" value="token-123"> after.</p>

  <p>change events fired: <span id="count">0</span></p>
  <script>
    var n = 0;
    var ids = ['remember', 'pw', 'note'];
    for (var i = 0; i < ids.length; i++) {
      document.getElementById(ids[i]).addEventListener('change', function () {
        n += 1;
        document.getElementById('count').textContent = String(n);
      });
    }
  </script>
</body>
</html>
