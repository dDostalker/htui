<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>snake (demo)</title>
<style>
  body { font-family: monospace; margin: 0; padding: 0 1; }
  #score { color: #7ee787; padding: 0 0 1 0; }
  #board { color: #e6edf3; }
  #status { color: #f0883e; }
  .btn {
    color: #79c0ff;
    padding: 0 1;
    border: 1 solid #30363d;
    cursor: pointer;
  }
  #hint { color: #8b949e; margin-top: 1; }
</style>
</head>
<body>
  <div id="score">score: 1</div>
  <pre id="board"></pre>
  <div id="status"></div>
  <div>
    <span class="btn" id="up">↑</span>
    <span class="btn" id="left">←</span>
    <span class="btn" id="right">→</span>
    <span class="btn" id="down">↓</span>
    <span class="btn" id="restart">restart</span>
  </div>
  <div id="hint">click a direction button to steer · auto-advances every 150 ms · hit wall or self to restart</div>

  <script>
    // 20 × 14 grid; snake as a list of [row, col], head first.
    var COLS = 20;
    var ROWS = 14;
    var snake, dir, nextDir, food, gameOver, scoreEl, boardEl, statusEl;

    function reset() {
      snake = [[7, 10], [7, 9], [7, 8]];
      dir = 'right';
      nextDir = 'right';
      gameOver = false;
      placeFood();
      scoreEl.textContent = 'score: ' + (snake.length - 1);
      statusEl.textContent = '';
    }

    function placeFood() {
      var cells = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var occupied = snake.some(function (p) { return p[0] === r && p[1] === c; });
          if (!occupied) cells.push([r, c]);
        }
      }
      if (cells.length === 0) {
        gameOver = true;
        statusEl.textContent = 'you win! click restart';
        return;
      }
      food = cells[Math.floor(Math.random() * cells.length)];
    }

    function turn(d) {
      // No 180° reversal in one step.
      if ((dir === 'up' && d === 'down') || (dir === 'down' && d === 'up') ||
          (dir === 'left' && d === 'right') || (dir === 'right' && d === 'left')) {
        return;
      }
      nextDir = d;
    }

    function tick() {
      if (gameOver) return;
      dir = nextDir;
      var head = snake[0];
      var nr = head[0], nc = head[1];
      if (dir === 'up') nr -= 1;
      if (dir === 'down') nr += 1;
      if (dir === 'left') nc -= 1;
      if (dir === 'right') nc += 1;

      var hitWall = nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS;
      var hitSelf = snake.some(function (p, i) {
        // The tail cell moves away this tick, unless we just ate.
        return i < snake.length - 1 && p[0] === nr && p[1] === nc;
      });
      if (hitWall || hitSelf) {
        gameOver = true;
        statusEl.textContent = 'game over — click restart';
        paint();
        return;
      }

      snake.unshift([nr, nc]);
      var ate = nr === food[0] && nc === food[1];
      if (ate) {
        scoreEl.textContent = 'score: ' + (snake.length - 1);
        placeFood();
      } else {
        snake.pop();
      }
      paint();
    }

    function paint() {
      var grid = [];
      for (var r = 0; r < ROWS; r++) {
        var line = '';
        for (var c = 0; c < COLS; c++) {
          var cell = ' ';
          if (food && food[0] === r && food[1] === c) cell = '@';
          snake.forEach(function (p) {
            if (p[0] === r && p[1] === c) cell = '#';
          });
          line += cell;
        }
        grid.push(line);
      }
      boardEl.textContent = grid.join('\n');
    }

    document.getElementById('up').addEventListener('click', function () { turn('up'); });
    document.getElementById('down').addEventListener('click', function () { turn('down'); });
    document.getElementById('left').addEventListener('click', function () { turn('left'); });
    document.getElementById('right').addEventListener('click', function () { turn('right'); });
    document.getElementById('restart').addEventListener('click', function () { reset(); paint(); });

    scoreEl = document.getElementById('score');
    boardEl = document.getElementById('board');
    statusEl = document.getElementById('status');
    reset();
    paint();
    // Game loop: the engine fires this every 150 ms (script thread).
    setInterval(tick, 150);
  </script>
</body>
</html>
