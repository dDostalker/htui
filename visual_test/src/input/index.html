<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; }
</style>
</head>
<body>
  <h2>&lt;input&gt; demo</h2>
  <p>Click a field, then type. Esc / Enter commit.</p>
  <p>Shift+←/→ select · Ctrl+A select-all · Ctrl+C/X copy/cut · Ctrl+V paste.</p>
  <p>Left-drag in a field selects by mouse · right-drag box-selects.</p>

  <p>Name: <input id="name" width="20" value="Ada"></p>
  <p>Empty: <input id="empty" width="20"></p>

  <p id="log">log: —</p>

  <script>
    // Browser-aligned field events: focus / blur / input / change fire along
    // the DOM chain; `el.value` reads & writes the committed DOM value.
    var log = document.getElementById('log');
    function show(v) { log.textContent = 'log: ' + v; }
    var name = document.getElementById('name');
    name.addEventListener('focus',  function () { show('focus'); });
    name.addEventListener('input',  function () { show('input  = ' + name.value); });
    name.addEventListener('change', function () { show('change = ' + name.value); });
    name.addEventListener('blur',   function () { show('blur   = ' + name.value); });
  </script>
</body>
</html>
