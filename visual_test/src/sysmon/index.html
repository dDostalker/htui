<!DOCTYPE html>
<html>
<head><title>System Monitor</title></head>
<body>
  <!-- Tokyo Night themed system monitor: header bar, side-by-side CPU /
       Memory stat cards, and full-width Disks / System panels. Progress bars
       are ASCII (`#` / `-`) so they render identically on any terminal. -->
  <div class="app">
    <div class="row header">
      <div class="brand grow">SYSTEM MONITOR</div>
      <div class="row gap-1">
        <div id="refresh" onclick="refresh()" class="btn">[ Refresh ]</div>
        <div id="quit" onclick="quit()" class="btn">[ Quit ]</div>
      </div>
    </div>
    <div id="meta" class="meta dim">sampling…</div>

    <div class="row gap-2">
      <div class="card grow">
        <div class="card-head cyan">CPU</div>
        <div class="row pad-x1 gap-1">
          <div id="cpuBar" class="bar">n/a</div>
          <div id="cpuPct" class="pct cyan">n/a</div>
        </div>
        <div id="cpuName" class="dim pad-x1">n/a</div>
      </div>
      <div class="card grow">
        <div class="card-head yel">MEMORY</div>
        <div class="row pad-x1 gap-1">
          <div id="memBar" class="bar">n/a</div>
          <div id="memText" class="pct yel">n/a</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head purp">DISKS</div>
      <div id="disks" class="dim pad-x1">n/a</div>
    </div>

    <div class="card">
      <div class="card-head green">SYSTEM</div>
      <div id="proc" class="val pad-x1">processes: n/a</div>
      <div id="now" class="val pad-x1">now: n/a</div>
    </div>
  </div>

  <script>
    // Auto-refresh driver: pull the latest snapshot from the host `sample()`
    // function and write it into the DOM (browser-style DOM mutation).
    function refresh() {
      var d = sample();
      setText('meta', d.host + ' · ' + d.os + ' · cores ' + d.cores);
      setText('cpuBar', d.cpuBar);
      setText('cpuPct', d.cpuPct);
      setText('cpuName', d.cpuName);
      setText('memBar', d.memBar);
      setText('memText', d.memText);
      setText('disks', d.disks);
      setText('proc', 'processes: ' + d.proc);
      setText('now', d.now + ' · session ' + d.session);
    }
    function setText(id, v) {
      document.getElementById(id).textContent = v;
    }
  </script>
</body>
</html>
