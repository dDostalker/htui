<!--
  htui visual test — viewport_units
  Run: cargo run -p visual_test -- viewport_units
  Demonstrates viewport-relative CSS lengths: vw and vh.
-->
<!doctype html>
<html>
<head>
  <style>
    body { margin: 0ch; }

    .w-50vw-h-3vh { width: 50vw; height: 3vh; margin-left: 2vw; }
    .w-20vw-h-25vh { width: 20vw; height: 25vh; margin: 2vh 2vw; padding: 2vh 2vw; }
    .nested { width: 50vw; height: 8vh; padding: 1vh 1vw; }
  </style>
</head>
<body>
  <h1>vw / vh viewport units</h1>
  <div class="w-50vw-h-3vh">width 50vw · height 3vh · margin-left 2vw</div>
  <div class="w-20vw-h-25vh">
    width 20vw · height 25vh · margin 2vh 2vw · padding 2vh 2vw
    <div class="nested">nested: width 50vw · height 8vh · padding 1vh 1vw</div>
  </div>
</body>
</html>
