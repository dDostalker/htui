<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>yazi (demo)</title>
<style>
  body { font-family: monospace; margin: 0; padding: 0 1; }
  #topbar { color: #7ee787; padding: 0 0 1 0; }
  #topbar .cwd { color: #e6edf3; }
  #back {
    color: #79c0ff;
    cursor: pointer;
  }
  .row { padding: 0 1; }
  .row.dir { color: #7ee787; }
  .row.file { color: #c9d1d9; }
  .row .size { color: #8b949e; }
  #footer { color: #8b949e; margin-top: 1; }
</style>
</head>
<body>
  <div id="topbar">
    <span id="back">[ .. ]</span>
    <span class="cwd" id="cwd">.</span>
  </div>
  <div id="list">
    <div class="row dim">loading…</div>
  </div>
  <div id="footer">click a directory to enter · click a file to select · [ .. ] goes up</div>

  <script>
    var listEl = document.getElementById('list');
    var cwdEl = document.getElementById('cwd');
    var backEl = document.getElementById('back');

    // Navigation history so [ .. ] can go back up the tree.
    var stack = ['.'];
    var current = '.';
    var selected = null;

    function joinPath(base, name) {
      return base === '.' ? './' + name : base + '/' + name;
    }

    function render() {
      var entries = listDir(current);   // host function: [{ name, is_dir, size }]
      while (listEl.firstChild) {
        listEl.removeChild(listEl.firstChild);
      }
      entries.forEach(function (e) {
        var row = document.createElement('div');
        var label = (e.is_dir ? '+ ' : '  ') + e.name + (e.is_dir ? '/' : '');
        row.className = e.is_dir ? 'row dir' : 'row file';
        row.textContent = label;
        if (!e.is_dir) {
          var size = document.createElement('span');
          size.className = 'size';
          size.textContent = '  ' + fmtSize(e.size);
          row.appendChild(size);
        }
        // Dynamically created rows: `on*` attributes are not compiled after
        // engine init, so listeners must be attached with addEventListener.
        row.addEventListener('click', function () {
          if (e.is_dir) {
            stack.push(current);
            current = joinPath(current, e.name);
            selected = null;
            render();
          } else {
            if (selected) selected.style.backgroundColor = '';
            row.style.backgroundColor = '#1f6feb';
            selected = row;
          }
        });
        listEl.appendChild(row);
      });
      cwdEl.textContent = current;
    }

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    backEl.addEventListener('click', function () {
      if (stack.length === 0) return;
      current = stack.pop();
      selected = null;
      render();
    });

    render();
  </script>
</body>
</html>
