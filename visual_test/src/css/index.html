<head>
    <meta charset="UTF-8" />
    <title>Flex Layout Demo</title>

    <style>
        /* htui cell-friendly CSS:
           - 1px == 1 cell, so all sizes use small em / % values
           - only SUPPORTED_PROPERTIES are honoured (no calc / border-radius /
             box-shadow / transition / transform / :hover / flex shorthand) */

        body {
            margin: 0;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 顶部导航 */
        header {
            background-color: #1e293b;
            color: white;
            padding: 1 2;
            font-size: 2em;
            font-weight: bold;
        }

        /* 主体布局：在 body 的 flex 列中占满剩余高度，把 footer 压到底部 */
        .layout {
            display: flex;
            flex-grow: 1;
        }

        /* 左侧栏 */
        .sidebar {
            width: 20%;
            background-color: #0f172a;
            color: white;
            padding: 1;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 1 0;
        }

        /* 右侧内容 */
        .content {
            flex-grow: 1;
            flex-basis: 0;
            padding: 2;
        }

        /* 卡片布局 */
        .cards {
            display: flex;
            gap: 1;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            padding: 1;
            flex-basis: 20%;
        }

        /* 底部 */
        footer {
            background-color: #1e293b;
            color: #cbd5e1;
            text-align: center;
            padding: 1;
        }
    </style>
</head>

<body>
    <header>My Flex Website</header>

    <div class="layout">
        <aside class="sidebar">
            <h3>Menu</h3>
            <a href="#">Dashboard</a>
            <a href="#">Projects</a>
            <a href="#">Tasks</a>
            <a href="#">Settings</a>
        </aside>

        <main class="content">
            <h2>Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h4>Users</h4>
                    <p>1,245 active users</p>
                </div>

                <div class="card">
                    <h4>Revenue</h4>
                    <p>$12,430 this month</p>
                </div>

                <div class="card">
                    <h4>Tasks</h4>
                    <p>23 tasks remaining</p>
                </div>

                <div class="card">
                    <h4>Servers</h4>
                    <p>4 running instances</p>
                </div>
            </div>
        </main>
    </div>

    <footer>© 2026 Flex Demo</footer>
</body>
