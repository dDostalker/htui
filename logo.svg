<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">htui logo</title>
  <desc id="desc">A rusted terminal window containing a pixel-art globe, representing the web rendered inside the terminal.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#34d399" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.35" stop-color="#b45309"/>
      <stop offset="0.7" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="corrode" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <mask id="edgeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="16" y="16" width="224" height="224" rx="34" fill="black"/>
      <rect x="16" y="16" width="224" height="224" rx="34" fill="none" stroke="white" stroke-width="16" filter="url(#soften)"/>
    </mask>
    <filter id="rustTexture" x="0" y="0" width="256" height="256">
      <feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.90
        0 0 0 0 0.45
        0 0 0 0 0.10
        0.4 0.4 0.2 0 0" result="rustColor"/>
      <feComponentTransfer in="rustColor" result="patches">
        <feFuncA type="discrete" tableValues="0 0 0.2 0.45 0.7 0.95"/>
      </feComponentTransfer>
      <feComposite in="patches" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="window">
      <rect x="16" y="16" width="224" height="224" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect x="16" y="16" width="224" height="224" rx="34" fill="url(#frame)"/>
    <rect x="16" y="16" width="224" height="46" fill="#111826"/>
    <path d="M16 62 H240" stroke="#263144" stroke-width="2"/>
    <circle cx="42" cy="39" r="5.5" fill="#ff5f57"/>
    <circle cx="62" cy="39" r="5.5" fill="#febc2e"/>
    <circle cx="82" cy="39" r="5.5" fill="#28c840"/>
  </g>

  <rect x="16" y="16" width="224" height="224" rx="34" fill="none" stroke="#3b4a63" stroke-width="2"/>

  <rect x="16" y="16" width="224" height="224" rx="34" fill="#9a4a16" filter="url(#rustTexture)" mask="url(#edgeMask)" opacity="0.55"/>
  <rect x="18" y="18" width="220" height="220" rx="32" fill="none" stroke="url(#rust)" stroke-width="10" filter="url(#corrode)" opacity="0.95"/>

  <g clip-path="url(#window)">
