name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests are pure in-memory (no terminal required), so they run on every
      # platform the crate targets.
      - name: Run tests
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # Keep the declared `rust-version` honest (boa_engine requires 1.88,
      # resvg's font stack requires 1.89).
      - name: Check
        run: cargo check --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Intentional structural lints (too_many_arguments, module_inception,
      # doc_lazy_continuation) are allowed in the workspace lint config
      # (root Cargo.toml), so any new warning fails the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Guard the repository's UTF-8 invariant: a lossy editor / tool pass
      # (ANSI or OEM conversion) must not silently reintroduce BOMs, invalid
      # byte sequences or U+FFFD replacement characters.
      - name: Check encoding
        run: |
          python3 - <<'PY'
          import os, sys
          skip = {".git", "target", "node_modules"}
          exts = (".rs", ".toml", ".md", ".yml", ".yaml", ".js", ".json", ".html", ".css", ".txt")
          bad = []
          for dirpath, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in skip]
              for fn in files:
                  if not fn.endswith(exts):
                      continue
                  p = os.path.join(dirpath, fn)
                  data = open(p, "rb").read()
                  if data.startswith(b"\xef\xbb\xbf"):
                      bad.append(f"{p}: UTF-8 BOM")
                      continue
                  if data.startswith((b"\xff\xfe", b"\xfe\xff")):
                      bad.append(f"{p}: UTF-16 BOM")
                      continue
                  if b"\x00" in data:
                      bad.append(f"{p}: NUL byte in text file")
                      continue
                  try:
                      text = data.decode("utf-8")
                  except UnicodeDecodeError as e:
                      bad.append(f"{p}: invalid UTF-8 at byte {e.start}")
                      continue
                  if "\ufffd" in text:
                      bad.append(f"{p}: U+FFFD replacement character")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("encoding OK")
          PY

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  ast-grep:
    name: ast-grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      # Project-specific rules (sg/rules/): no unsafe / unwrap / println /
      # wildcard imports in src. See AGENTS.md.
      - name: Scan
        run: ast-grep scan
