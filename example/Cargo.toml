[package]
name = "example"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone scratch crate (gitignored): the empty `[workspace]` table
# detaches it from the repository workspace, so `cargo run` / `cargo test`
# work here without touching the root workspace members.
[workspace]

[dependencies]
htui = { path = "../crates/htui" }

# The engine's layout / paint / diff path is on the frame critical path; an
# unoptimized build animates at a fraction of the terminal's frame budget.
# Optimizing the dependency keeps `cargo run` iteration on the example crate
# itself fast (it stays at dev opt-level).
[profile.dev.package.htui]
opt-level = 2
