[workspace]
members = ["crates/htui", "crates/htui-macros"]
resolver = "3"

# Cross-crate inlining for release builds: the render pipeline and the Boa
# engine are both call-heavy, so LTO measurably helps the shipped binary.
# `thin` keeps release build times reasonable; switch to `lto = true` (fat)
# when squeezing the last percent of runtime matters more than build time.
[profile.release]
lto = "thin"

# Single source of truth for dependency versions: member crates reference
# these with `<dep> = { workspace = true }` and must not pin their own
# versions. Features live here too (features are additive; members may add,
# never remove).
[workspace.dependencies]
htui-macros = { path = "crates/htui-macros", version = "0.1.0" }
bitflags = "2"
crossterm = "0.29.0"
cssparser = "0.31.2"
html5ever = "0.27"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
indexmap = "2.14"
log = { version = "0.4.29", features = ["release_max_level_warn"] }
markup5ever_rcdom = "0.3"
slotmap = "1.1.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
boa_engine = { version = "0.21.1", default-features = false }
thiserror = "2.0.19"
compact_str = "0.10.0"
env_logger = "0.11.9"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[workspace.lints.clippy]
# Pipeline stages pass their whole working set in one call; splitting the wide
# signatures into argument structs would add an abstraction layer the
# architecture deliberately avoids (see AGENTS.md).
too_many_arguments = "allow"
# `layout::layoutbox::geometry`-style nesting is intentional: the submodule
# carries the public concept name of its parent.
module_inception = "allow"
# Pre-existing doc-comment list formatting. Existing API comments are not
# rewritten casually (see AGENTS.md), so the lint stays allowed.
doc_lazy_continuation = "allow"
