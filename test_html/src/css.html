<head>
    <meta charset="UTF-8" />
    <title>Flex Layout Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* 顶部导航 */
        header {
            background: #1e293b;
            color: white;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: bold;
        }

        /* 主体布局 */
        .layout {
            display: flex;
            min-height: calc(100vh - 120px);
        }

        /* 左侧栏 */
        .sidebar {
            width: 220px;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 0;
        }

        .sidebar a:hover {
            color: white;
        }

        /* 右侧内容 */
        .content {
            flex: 1;
            padding: 30px;
        }

        /* 卡片布局 */
        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            width: 220px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* 底部 */
        footer {
            background: #1e293b;
            color: #cbd5e1;
            text-align: center;
            padding: 16px;
        }
    </style>
</head>

<body>
    <header>My Flex Website</header>

    <div class="layout">
        <aside class="sidebar">
            <h3>Menu</h3>
            <a href="#">Dashboard</a>
            <a href="#">Projects</a>
            <a href="#">Tasks</a>
            <a href="#">Settings</a>
        </aside>

        <main class="content">
            <h2>Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h4>Users</h4>
                    <p>1,245 active users</p>
                </div>

                <div class="card">
                    <h4>Revenue</h4>
                    <p>$12,430 this month</p>
                </div>

                <div class="card">
                    <h4>Tasks</h4>
                    <p>23 tasks remaining</p>
                </div>

                <div class="card">
                    <h4>Servers</h4>
                    <p>4 running instances</p>
                </div>
            </div>
        </main>
    </div>

    <footer>© 2026 Flex Demo</footer>
</body>
